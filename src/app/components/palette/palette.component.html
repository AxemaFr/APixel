<div class="pixel-box ui-palette" role="group" aria-label="Color palette">
  <div class="ui-palette__header">
    <button type="button" class="ui-palette__arrow" aria-label="Previous palette" (click)="prev()">&lt;</button>
    <span class="ui-palette__name" aria-live="polite">{{ current().name }}</span>
    <button type="button" class="ui-palette__arrow" aria-label="Next palette" (click)="next()">&gt;</button>
  </div>
  <div class="ui-palette__colors">
    @for (color of current().colors; track $index) {
      <span class="ui-palette__color" [style.background-color]="toCssColor(color)"></span>
    } @empty {
      <span class="ui-palette__hint">Keeps the image colors</span>
    }
  </div>
</div>
